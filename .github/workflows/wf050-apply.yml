name: Apply WF-050 API hardening

on:
  pull_request:
  push:
    branches:
      - architect/wf-050-bounded-input-truthful-errors

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architect/wf-050-bounded-input-truthful-errors
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded parser and truthful failure paths
        run: |
          python - <<'PY'
          import json
          import textwrap
          from pathlib import Path

          def normalize(path: Path) -> str:
              return path.read_text(encoding="utf-8").replace("\r\n", "\n").replace("\r", "\n")

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              if source.count(old) != 1:
                  raise SystemExit(f"{label}: expected one match, found {source.count(old)}")
              return source.replace(old, new, 1)

          server_path = Path("services/workframe-api/server.py")
          server = normalize(server_path)
          server = replace_once(
              server,
              "import route_registry\n",
              "import route_registry\nimport request_body\n",
              "server request_body import",
          )
          read_start = server.index("    def _read_json(")
          read_end = server.index("\n    # ------------------------------------------------------------------\n    # Security headers", read_start)
          read_method = textwrap.indent(
              textwrap.dedent(
                  '''\
                  def _read_json(self) -> dict[str, Any]:
                      return request_body.read_json_object(self.rfile, self.headers)
                  '''
              ),
              "    ",
          )
          server = server[:read_start] + read_method + server[read_end:]

          delete_start = server.index("    def do_DELETE(")
          delete_end = server.index("\n    def do_POST(", delete_start)
          delete_method = textwrap.indent(
              textwrap.dedent(
                  '''\
                  def do_DELETE(self) -> None:  # noqa: N802
                      """Route DELETE requests: rooms, members, memory."""
                      parsed = urllib.parse.urlparse(self.path)
                      path = parsed.path
                      if not _auth_check(self):
                          return self._json(401, {"ok": False, "error": "no_session"})
                      try:
                          body = self._read_json() if self.headers.get("Content-Length") else {}
                          if route_registry.dispatch_pattern("DELETE", self, path, body=body):
                              return
                          return self._json(404, {"error": "not_found"})
                      except request_body.RequestBodyError as exc:
                          return self._json(exc.status, {"ok": False, "error": exc.code})
                      except Exception as exc:  # noqa: BLE001
                          _log_handler_error(f"DELETE {path}", exc)
                          return self._json(500, {"ok": False, "error": "internal_error"})
                  '''
              ),
              "    ",
          )
          server = server[:delete_start] + delete_method + server[delete_end:]
          server = server.replace(
              'return self._json(415, {"error": "Content-Type must be application/json"})',
              'return self._json(415, {"ok": False, "error": "unsupported_media_type"})',
          )
          server = replace_once(
              server,
              "            post_body = body if isinstance(body, dict) else {}\n",
              "            post_body = body\n",
              "POST body fallback",
          )
          server = replace_once(
              server,
              '''        except ValueError as exc:
              return self._json(400, {"error": str(exc)})
          except Exception as exc:  # noqa: BLE001
              return self._json(500, {"ok": False, "error": str(exc)})

      def do_PATCH'''.replace("      ", ""),
              '''        except request_body.RequestBodyError as exc:
              return self._json(exc.status, {"ok": False, "error": exc.code})
          except ValueError as exc:
              return self._json(400, {"error": str(exc)})
          except Exception as exc:  # noqa: BLE001
              _log_handler_error(f"POST {path}", exc)
              return self._json(500, {"ok": False, "error": "internal_error"})

      def do_PATCH'''.replace("      ", ""),
              "POST catches",
          )
          server = replace_once(
              server,
              '''        except ValueError as exc:
              return self._json(400, {"error": str(exc)})
          except Exception as exc:  # noqa: BLE001
              return self._json(500, {"ok": False, "error": str(exc)})




  _ensure_runtime_tokens_table'''.replace("  ", ""),
              '''        except request_body.RequestBodyError as exc:
              return self._json(exc.status, {"ok": False, "error": exc.code})
          except ValueError as exc:
              return self._json(400, {"error": str(exc)})
          except Exception as exc:  # noqa: BLE001
              _log_handler_error(f"PATCH {path}", exc)
              return self._json(500, {"ok": False, "error": "internal_error"})




  _ensure_runtime_tokens_table'''.replace("  ", ""),
              "PATCH catches",
          )
          get_old = '''        except Exception as exc:  # noqa: BLE001
              return self._json(500, {"ok": False, "error": str(exc)})

      # ------------------------------------------------------------------
      # First-owner bootstrap'''.replace("      ", "")
          get_new = '''        except Exception as exc:  # noqa: BLE001
              _log_handler_error(f"GET {path}", exc)
              return self._json(500, {"ok": False, "error": "internal_error"})

      # ------------------------------------------------------------------
      # First-owner bootstrap'''.replace("      ", "")
          server = replace_once(server, get_old, get_new, "GET generic error")
          server_path.write_text(server, encoding="utf-8")

          provider_path = Path("services/workframe-api/handler_modules/handler_provider.py")
          provider = normalize(provider_path)
          provider = replace_once(
              provider,
              "import platform_auth\n",
              "import platform_auth\nimport request_body\n",
              "provider request_body import",
          )
          raw_old = '''        body: bytes | None = None
          if method.upper() in {"POST", "PUT", "PATCH"}:
              length = int(self.headers.get("Content-Length") or 0)
              body = self.rfile.read(length) if length > 0 else b""
          return'''.replace("          ", "")
          raw_new = '''        body: bytes | None = None
          if method.upper() in {"POST", "PUT", "PATCH"}:
              try:
                  body = request_body.read_body_bytes(self.rfile, self.headers)
              except request_body.RequestBodyError as exc:
                  self._json(exc.status, {"ok": False, "error": exc.code})
                  return True
          return'''.replace("          ", "")
          if provider.count(raw_old) != 2:
              raise SystemExit(f"provider proxy body readers: expected 2, found {provider.count(raw_old)}")
          provider = provider.replace(raw_old, raw_new, 2)
          provider = replace_once(
              provider,
              '''        except ValueError as exc:
              self._json(400, {"ok": False, "error": str(exc)})
          except Exception as exc:  # noqa: BLE001
              srv._log_handler_error("internal.runs.record", exc)'''.replace("          ", ""),
              '''        except request_body.RequestBodyError as exc:
              self._json(exc.status, {"ok": False, "error": exc.code})
          except ValueError as exc:
              self._json(400, {"ok": False, "error": str(exc)})
          except Exception as exc:  # noqa: BLE001
              srv._log_handler_error("internal.runs.record", exc)'''.replace("          ", ""),
              "internal record body error",
          )
          provider_path.write_text(provider, encoding="utf-8")

          workspace_path = Path("services/workframe-api/handler_modules/handler_workspace.py")
          workspace = normalize(workspace_path)
          workspace = replace_once(
              workspace,
              "import message_reactions\n",
              "import message_reactions\nimport request_body\n",
              "workspace request_body import",
          )

          def replace_method(source: str, name: str, next_name: str, body: str) -> str:
              start = source.index(f"    def {name}(")
              end = source.index(f"\n    def {next_name}(", start)
              method = textwrap.indent(textwrap.dedent(body).strip() + "\n", "    ")
              return source[:start] + method + source[end:]

          workspace = replace_method(
              workspace,
              "_route_pattern_get_room_members",
              "_route_pattern_get_room_live",
              '''
              def _route_pattern_get_room_members(self, path: str, qs: dict[str, list[str]]) -> None:
                  srv = _srv()
                  rid = path.strip("/").split("/")[-2]
                  viewer_id = str(getattr(self, "auth_user", "") or "")
                  try:
                      conn = srv._workframe_db()
                      try:
                          conn.row_factory = sqlite3.Row
                          if not srv._user_can_access_room(conn, rid, viewer_id):
                              self._json(403, {"ok": False, "error": "forbidden"})
                              return
                          members = conn.execute(
                              "SELECT * FROM room_memberships WHERE room_id = ? AND deleted_at IS NULL",
                              (rid,),
                          ).fetchall()
                          payload = srv._enrich_room_members(conn, [dict(row) for row in members])
                      finally:
                          conn.close()
                  except sqlite3.Error as exc:
                      srv._log_handler_error("GET room members", exc)
                      self._json(503, {"ok": False, "error": "database_unavailable"})
                      return
                  self._json(200, {"ok": True, "room_id": rid, "members": payload})
              ''',
          )
          workspace = replace_method(
              workspace,
              "_route_pattern_get_room_messages",
              "_route_pattern_post_workspace_rooms",
              '''
              def _route_pattern_get_room_messages(self, path: str, qs: dict[str, list[str]]) -> None:
                  srv = _srv()
                  slug_or_id = path.strip("/").split("/")[-2]
                  user_id = str(getattr(self, "auth_user", "") or "")
                  if not user_id:
                      self._json(401, {"ok": False, "error": "no_session"})
                      return
                  try:
                      limit, offset = request_body.parse_pagination(qs)
                  except request_body.RequestBodyError as exc:
                      self._json(exc.status, {"ok": False, "error": exc.code})
                      return
                  try:
                      conn = srv._workframe_db()
                      try:
                          room = conn.execute(
                              "SELECT id FROM rooms WHERE (id = ? OR slug = ?) AND deleted_at IS NULL",
                              (slug_or_id, slug_or_id),
                          ).fetchone()
                          if not room:
                              self._json(404, {"ok": False, "error": "room_not_found"})
                              return
                          rid = str(room["id"])
                          if not srv._user_can_access_room(conn, rid, user_id):
                              self._json(403, {"ok": False, "error": "forbidden"})
                              return
                          messages = conn.execute(
                              """
                              SELECT * FROM (
                                  SELECT * FROM messages
                                  WHERE room_id = ? AND deleted_at IS NULL
                                  ORDER BY created_at DESC
                                  LIMIT ? OFFSET ?
                              ) AS recent
                              ORDER BY created_at ASC
                              """,
                              (rid, limit, offset),
                          ).fetchall()
                          total = int(conn.execute(
                              "SELECT COUNT(*) FROM messages WHERE room_id = ? AND deleted_at IS NULL",
                              (rid,),
                          ).fetchone()[0])
                          payload = srv._enrich_room_messages(conn, messages)
                      finally:
                          conn.close()
                  except sqlite3.Error as exc:
                      srv._log_handler_error("GET room messages", exc)
                      self._json(503, {"ok": False, "error": "database_unavailable"})
                      return
                  self._json(200, {
                      "ok": True,
                      "messages": payload,
                      "total": total,
                      "limit": limit,
                      "offset": offset,
                  })
              ''',
          )
          collection_specs = (
              (
                  "_route_pattern_get_workspace_invites",
                  "_route_pattern_get_invite",
                  "invites",
                  "SELECT id, workspace_id, email, role, invited_by_user_id, expires_at, created_at, accepted_at, deleted_at FROM workspace_invites WHERE workspace_id = ? AND deleted_at IS NULL ORDER BY created_at DESC",
                  "invites",
              ),
              (
                  "_route_pattern_get_workspace_memory",
                  "_route_pattern_get_workspace_budget",
                  "items",
                  "SELECT * FROM memory_items WHERE workspace_id = ? AND deleted_at IS NULL ORDER BY created_at DESC",
                  "items",
              ),
              (
                  "_route_pattern_get_workspace_budget",
                  "_route_pattern_get_workspace_grants",
                  "policies",
                  "SELECT * FROM budget_policies WHERE workspace_id = ? ORDER BY created_at DESC",
                  "budget_policies",
              ),
          )
          for name, next_name, local_name, sql, response_key in collection_specs:
              workspace = replace_method(
                  workspace,
                  name,
                  next_name,
                  f'''
                  def {name}(self, path: str, qs: dict[str, list[str]]) -> None:
                      srv = _srv()
                      parts = path.strip("/").split("/")
                      if len(parts) != 4:
                          self._json(404, {{"ok": False, "error": "not_found"}})
                          return
                      ws_id = srv._resolve_wid(parts[2])
                      if not ws_id:
                          self._json(404, {{"ok": False, "error": "workspace_not_found"}})
                          return
                      try:
                          conn = srv._workframe_db()
                          try:
                              conn.row_factory = sqlite3.Row
                              {local_name} = conn.execute({sql!r}, (ws_id,)).fetchall()
                          finally:
                              conn.close()
                      except sqlite3.Error as exc:
                          srv._log_handler_error("GET workspace {response_key}", exc)
                          self._json(503, {{"ok": False, "error": "database_unavailable"}})
                          return
                      self._json(200, {{"ok": True, "{response_key}": [dict(row) for row in {local_name}]}})
                  ''',
              )
          workspace = replace_method(
              workspace,
              "_route_pattern_get_invite",
              "_route_pattern_get_workspace_memory",
              '''
              def _route_pattern_get_invite(self, path: str, qs: dict[str, list[str]]) -> None:
                  srv = _srv()
                  parts = path.strip("/").split("/")
                  if len(parts) != 3:
                      self._json(404, {"ok": False, "error": "not_found"})
                      return
                  token_hash = hashlib.sha256(parts[2].encode("utf-8")).hexdigest()
                  try:
                      conn = srv._workframe_db()
                      try:
                          conn.row_factory = sqlite3.Row
                          invite = conn.execute(
                              "SELECT id, workspace_id, email, role, invited_by_user_id, expires_at, created_at, accepted_at, deleted_at FROM workspace_invites WHERE token_hash = ? AND deleted_at IS NULL",
                              (token_hash,),
                          ).fetchone()
                      finally:
                          conn.close()
                  except sqlite3.Error as exc:
                      srv._log_handler_error("GET invite", exc)
                      self._json(503, {"ok": False, "error": "database_unavailable"})
                      return
                  if not invite:
                      self._json(404, {"ok": False, "error": "invite_not_found"})
                      return
                  self._json(200, {"ok": True, "invite": dict(invite)})
              ''',
          )
          workspace = replace_method(
              workspace,
              "_route_pattern_get_workspace_grants",
              "_route_pattern_get_workspace_events",
              '''
              def _route_pattern_get_workspace_grants(self, path: str, qs: dict[str, list[str]]) -> None:
                  srv = _srv()
                  parts = path.strip("/").split("/")
                  if len(parts) != 4:
                      self._json(404, {"ok": False, "error": "not_found"})
                      return
                  ws_id = srv._resolve_wid(parts[2])
                  if not ws_id:
                      self._json(404, {"ok": False, "error": "workspace_not_found"})
                      return
                  try:
                      conn = srv._workframe_db()
                      try:
                          conn.row_factory = sqlite3.Row
                          grants = conn.execute(
                              "SELECT cg.*, cb.provider AS binding_provider FROM credential_grants cg LEFT JOIN credential_bindings cb ON cb.id = cg.credential_binding_id WHERE cb.workspace_id = ? OR cg.grantee_id = ? ORDER BY cg.created_at DESC",
                              (ws_id, ws_id),
                          ).fetchall()
                      finally:
                          conn.close()
                  except sqlite3.Error as exc:
                      srv._log_handler_error("GET workspace grants", exc)
                      self._json(503, {"ok": False, "error": "database_unavailable"})
                      return
                  self._json(200, {"ok": True, "grants": [dict(row) for row in grants]})
              ''',
          )
          workspace_path.write_text(workspace, encoding="utf-8")

          ledger_path = Path("docs/ledger/ledger.json")
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          row = next(item for item in ledger["items"] if item["id"] == "WF-050")
          row["status"] = "done"
          row["pull_request"] = 28
          row["evidence"] = [
              "services/workframe-api/request_body.py owns bounded strict body and pagination parsing.",
              "POST/PATCH/DELETE and internal proxy/record paths reject malformed or oversized bodies before dispatch.",
              "Room members/messages and workspace invite/memory/budget/grant failures return database_unavailable rather than empty success.",
              "test_request_body.py and test_truthful_failures.py cover parser and backend-fault behavior."
          ]
          ledger["updated"] = "2026-08-02"
          ledger_path.write_text(json.dumps(ledger, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
      - name: Verify canonical API
        run: |
          python services/workframe-api/test_request_body.py
          python services/workframe-api/test_truthful_failures.py
          python services/workframe-api/test_resource_scope.py
          python services/workframe-api/test_route_registry.py
          python -m unittest discover -s services/workframe-api -p 'test_*.py'
          python -m json.tool docs/ledger/ledger.json >/dev/null
      - name: Commit verified implementation and remove this one-shot workflow
        run: |
          rm .github/workflows/wf050-apply.yml
          git config user.name "workframe-api-maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add services/workframe-api/server.py services/workframe-api/request_body.py services/workframe-api/handler_modules/handler_provider.py services/workframe-api/handler_modules/handler_workspace.py services/workframe-api/test_request_body.py services/workframe-api/test_truthful_failures.py docs/ledger/ledger.json .github/workflows/wf050-apply.yml
          git commit -m "fix(api): bound JSON input and make failures truthful"
          git push origin HEAD:architect/wf-050-bounded-input-truthful-errors
